name: solo82-paperbench
services:
  desk:
    build:
      context: .
      args:
        PAPERBENCH_RUNTIME_IMAGE: ${PAPERBENCH_RUNTIME_IMAGE:-python:3.12-slim}
    image: ${PAPERBENCH_IMAGE:-solo82-paperbench:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    ports:
      - "127.0.0.1:${PAPERBENCH_PORT:-19882}:8000"
    volumes:
      - paper-library:/var/lib/paperbench
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/paper/health', timeout=3).status == 200"]
      interval: 3s
      timeout: 4s
      retries: 12
volumes:
  paper-library:
